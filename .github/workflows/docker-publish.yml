name: Publish Docker image

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Tag pushes carry no branch, so a tag on an unmerged commit would otherwise publish
    - name: Require tagged commit on main
      run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

    # The tag is the fork's own version, so the library version is recorded separately
    - name: Read garminconnect version
      id: source
      run: |
        garminconnect=$(python3 -c "import tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(d.split('==')[1] for d in deps if d.startswith('garminconnect==')))")
        echo "garminconnect=$garminconnect" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/dev-fabi/garmin_mcp
        tags: |
          type=ref,event=tag
          type=raw,value=latest
        labels: |
          io.github.dev-fabi.garminconnect.version=${{ steps.source.outputs.garminconnect }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
